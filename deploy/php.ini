variables_order = "EGPCS"
date.timezone = Asia/Jakarta
memory_limit = 256M
upload_max_filesize = 6M
post_max_size = 8M
max_file_uploads = 10
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
opcache.enable = 1
opcache.validate_timestamps = 0
